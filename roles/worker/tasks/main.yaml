- name: Install worker node dependencies
  become: true
  ansible.builtin.apt:
    pkg:
      - conntrack
      - kmod
      - ipset
      - socat

- name: Disable swap
  become: true
  ansible.builtin.command: swapoff -a

- name: Make cni configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/cni/net.d
    state: directory

- name: Make containerd config directory
  become: true
  ansible.builtin.file:
    path: /etc/containerd
    state: directory

- name: Make kubelet data directory
  become: true
  ansible.builtin.file:
    path: /var/lib/kubelet
    state: directory

- name: Make kube-proxy data directory
  become: true
  ansible.builtin.file:
    path: /var/lib/kube-proxy
    state: directory

- name: Make kubernetes data directory
  become: true
  ansible.builtin.file:
    path: /var/lib/kubernetes
    state: directory

- name: Make kubernetes run directory
  become: true
  ansible.builtin.file:
    path: /var/run/kubernetes
    state: directory

- name: Write bridge configuration
  become: true
  ansible.builtin.template:
    src: 10-bridge.conf
    dest: /etc/cni/net.d/10-bridge.conf
    backup: true

- name: Write loopback configuration
  become: true
  ansible.builtin.template:
    src: 99-loopback.conf
    dest: /etc/cni/net.d/99-bridge.conf
    backup: true

- name: Load br-netfilter module
  become: true
  ansible.builtin.command: modprobe br-netfilter

- name: Apply ipv4 bridge nf call sysctl option
  become: true
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: 1

- name: Apply ipv6 bridge nf call sysctl option
  become: true
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-ip6tables
    value: 1

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present

- name: Install kube-proxy
  become: true
  ansible.builtin.get_url:
    url: https://dl.k8s.io/v1.32.3/bin/linux/arm64/kube-proxy
    dest: /usr/local/bin/kube-proxy
    mode: '0755'

- name: Install kubelet
  become: true
  ansible.builtin.apt:
    name: kubelet
    state: present

- name: Install runc
  become: true
  ansible.builtin.apt:
    name: runc
    state: present

- name: Install cri-tools
  become: true
  ansible.builtin.apt:
    name: cri-tools
    state: present

- name: Install containerd
  become: true
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Copy containerd unit file
  become: true
  ansible.builtin.template:
    src: containerd.service
    dest: /etc/systemd/system/containerd.service
    backup: true
  notify: Reload service configurations

- name: Write containerd config file
  become: true
  ansible.builtin.template:
    src: containerd-config.toml
    dest: /etc/containerd/config.toml
    backup: true

- name: Copy kubelet unit file
  ansible.builtin.template:
    src: kubelet.service
    dest: /etc/systemd/system/kubelet.service
    backup: true
  notify: Reload service configurations

- name: Write kubelet config file
  become: true
  ansible.builtin.template:
    src: kubelet-config.yaml
    dest: /var/lib/kubelet/kubelet-config.yaml
    backup: true

- name: Copy kube-proxy unit file
  ansible.builtin.template:
    src: kube-proxy.service
    dest: /etc/systemd/system/kube-proxy.service
    backup: true
  notify: Reload service configurations

- name: Write kube-proxy config file
  become: true
  ansible.builtin.template:
    src: kube-proxy-config.yaml
    dest: /var/lib/kube-proxy/kube-proxy-config.yaml
    backup: true

- name: Start containerd
  ansible.builtin.service:
    name: containerd
    state: restarted
    enabled: true

- name: Start kubelet
  ansible.builtin.service:
    name: kubelet
    state: restarted
    enabled: true

- name: Start kube-proxy
  ansible.builtin.service:
    name: kube-proxy
    state: restarted
    enabled: true
